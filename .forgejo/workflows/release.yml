name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  IMAGE: git.lorenzoiovino.com/loke/wardrowbe

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker CLI
        run: |
          apt-get update -qq && apt-get install -y --no-install-recommends ca-certificates curl gnupg >/dev/null
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
          apt-get update -qq && apt-get install -y --no-install-recommends docker-ce-cli docker-buildx-plugin >/dev/null
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${{ github.ref_name }}"
            version="${version#v}"
          else
            version="dev-$(echo "${{ github.sha }}" | cut -c1-7)"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Build e push
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          echo "${{ secrets.REGISTRY_TOKEN }}" | docker login git.lorenzoiovino.com -u loke --password-stdin
          docker buildx build --platform linux/amd64 --push -t "${IMAGE}:backend-${version}" backend
          docker buildx build --platform linux/amd64 --push -t "${IMAGE}:frontend-${version}" frontend
      - name: Images
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          echo "${IMAGE}:backend-${version}"
          echo "${IMAGE}:frontend-${version}"
